<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Night Cloud</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ЭКРАН ЗАГРУЗКИ -->
<div id="splash" class="splash">
  <img class="splash__logo" src="assets/logo.png" alt="Night Cloud">
  <div class="loader">
    <div class="loader__fill" id="loaderFill"></div>
  </div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<main id="app" class="app">
  <header class="hero">
    <h1 class="hero__welcome">Welcome, <span id="userName">guest</span></h1>
    <p class="hero__brand">Night Cloud</p>
  </header>

  <section class="grid">
    <div class="tile">
      <span class="tile__label">Private</span>
      <article class="board">
        <img class="board__img" src="assets/private.jpg" alt="">
        <p class="board__text">new logs every day</p>
      </article>
    </div>

    <div class="tile">
      <span class="tile__label">Free logs</span>
      <article class="board">
        <img class="board__img" src="assets/free.jpg" alt="">
        <p class="board__text">new logs and sometimes logs from the private channel</p>
      </article>
    </div>

    <div class="tile tile--wide">
      <span class="tile__label">Payment</span>
      <article class="board board--wide">
        <img class="board__img" src="assets/payment.jpg" alt="">
        <div class="board__info">
          <div class="prices">
            <div class="price">
              <span class="price__term">Week</span>
              <span class="price__value">$25</span>
            </div>
            <div class="price">
              <span class="price__term">Month</span>
              <span class="price__value">$40</span>
            </div>
            <div class="price">
              <span class="price__term">Lifetime</span>
              <span class="price__value">$75</span>
            </div>
          </div>
          <p class="board__text">
            The purchase of a private account is carried out from the project creator &mdash;
            <a class="board__link" href="https://t.me/idLeek" data-tg-link>@idLeek</a>.
          </p>
        </div>
      </article>
    </div>
  </section>

  <section class="actions">
    <a class="btn" href="https://t.me/NightULP" data-tg-link>Get a link</a>
    <a class="btn btn--primary" href="https://t.me/idLeek" data-tg-link>Buy a private channel</a>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
